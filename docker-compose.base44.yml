services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: fazaa
      MYSQL_USER: fazaa
      MYSQL_PASSWORD: fazaa_pass
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufazaa", "-pfazaa_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  migrate:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=mysql://fazaa:fazaa_pass@mysql:3306/fazaa
    command: >
      sh -c "corepack enable && corepack prepare pnpm@10.4.1 --activate && pnpm install --frozen-lockfile && pnpm exec drizzle-kit migrate"

  app:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=mysql://fazaa:fazaa_pass@mysql:3306/fazaa
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    ports:
      - "3000:3000"
    command: sh -c "corepack enable && corepack prepare pnpm@10.4.1 --activate && pnpm install --frozen-lockfile && pnpm dev"

volumes:
  mysql_data:
  app_node_modules:

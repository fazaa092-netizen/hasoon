services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: fazaa
      MYSQL_USER: fazaa
      MYSQL_PASSWORD: fazaa_pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fazaa", "-pfazaa_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fazaa_db:/var/lib/mysql

  migrate:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install -g pnpm@10.4.1 && pnpm install && pnpm exec drizzle-kit migrate"
    environment:
      DATABASE_URL: mysql://fazaa:fazaa_pass@db:3306/fazaa
    volumes:
      - .:/app
      - fazaa_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install -g pnpm@10.4.1 && pnpm install && pnpm dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://fazaa:fazaa_pass@db:3306/fazaa
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - fazaa_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  fazaa_db:
  fazaa_node_modules:
